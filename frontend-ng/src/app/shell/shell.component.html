<div class="app-shell flex h-screen text-slate-900 overflow-hidden">
  <div class="app-shell-bg" aria-hidden="true"></div>

  <aside
    class="sidebar shrink-0 md:flex flex-col fixed md:static inset-y-0 left-0 z-30 transition-transform md:translate-x-0"
    [class.flex]="sidebarOpen()"
    [class.hidden]="!sidebarOpen()"
    [class.no-transition]="resizing()"
    [style.width.px]="sidebarWidth()"
  >
    <div class="h-16 flex items-center gap-2 px-5 border-b border-white/10 shrink-0">
      <div class="logo-badge">A</div>
      <span class="font-semibold tracking-tight text-lg text-white">Agri-Chain OS</span>
    </div>
    <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="nav-active"
          class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm"
        >
          <span class="nav-indicator"></span>
          <mat-icon class="!w-5 !h-5 !text-[20px]">{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
    <div class="p-3 border-t border-white/10 text-xs text-white/60 shrink-0">
      Agri-Chain OS &copy; {{ 2026 }}
    </div>

    <div class="resize-handle" (pointerdown)="onResizeStart($event)"></div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="topbar h-16 shrink-0 flex items-center gap-4 px-4 md:px-6">
      <button class="md:hidden p-2 rounded-lg hover:bg-black/5" (click)="toggleSidebar()">
        <mat-icon>menu</mat-icon>
      </button>

      <div class="brand-mark hidden md:flex items-center gap-2 shrink-0">
        <div class="logo-badge-sm">A</div>
        <span class="font-semibold tracking-tight text-sm text-slate-800">Agri-Chain OS</span>
      </div>

      <div class="ticker-wrap flex-1 min-w-0">
        <div class="ticker-track">
          @for (msg of tickerMessages; track msg) {
            <span class="ticker-item">{{ msg }}</span>
          }
          @for (msg of tickerMessages; track msg) {
            <span class="ticker-item" aria-hidden="true">{{ msg }}</span>
          }
        </div>
      </div>

      <div class="flex items-center gap-3 shrink-0">
        <div class="user-chip">
          <span class="user-avatar">{{ userInitial }}</span>
          <span class="hidden sm:inline text-sm text-slate-600">{{ userEmail }}</span>
        </div>
        <button class="logout-btn" (click)="logout()" title="Logout">
          <mat-icon>logout</mat-icon>
        </button>
      </div>
    </header>
    <main class="flex-1 overflow-y-auto p-4 md:p-6">
      <router-outlet />
    </main>
  </div>
</div>
