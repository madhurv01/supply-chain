<div class="min-h-screen w-full flex items-center justify-center bg-surface-0 px-4" style="background: radial-gradient(circle at 20% 20%, #16241c 0%, #0a0e0d 60%);">
  <div class="w-full max-w-md">
    <div class="flex flex-col items-center mb-8">
      <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-accent-emerald to-accent-lime flex items-center justify-center font-bold text-xl text-surface-0 mb-3">A</div>
      <h1 class="text-2xl font-semibold tracking-tight text-white">Agri-Chain OS</h1>
      <p class="text-slate-400 text-sm mt-1">Agricultural supply-chain intelligence</p>
    </div>

    <div class="card p-6">
      <mat-tab-group [(selectedIndex)]="tab" mat-stretch-tabs animationDuration="150ms">
        <mat-tab label="Sign in"></mat-tab>
        <mat-tab label="Sign up"></mat-tab>
      </mat-tab-group>

      <form class="mt-4 flex flex-col gap-2" (ngSubmit)="submit()">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" name="email" [(ngModel)]="email" autocomplete="email" required />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" name="password" [(ngModel)]="password" autocomplete="current-password" required />
        </mat-form-field>

        <button
          mat-flat-button
          color="primary"
          type="submit"
          class="!mt-2 !h-11 !rounded-lg"
          [disabled]="loading()"
        >
          {{ loading() ? 'Please wait…' : (tab() === 0 ? 'Sign in' : 'Create account') }}
        </button>
      </form>
    </div>
  </div>
</div>
